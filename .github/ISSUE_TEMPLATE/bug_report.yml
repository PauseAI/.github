name: Bug report
description: Something isn't working as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this.

        **Security problem or personal data?** Don't file it here: public issues can be read by anyone. See [how to report privately](https://github.com/PauseAI/.github/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we see it ourselves? Links to the page help.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
  - type: textarea
    id: environment
    attributes:
      label: Where did you see it?
      description: Browser, device or operating system, and anything else that might matter.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, error messages or logs. Please remove any personal details (names, emails, phone numbers) first.
  - type: checkboxes
    id: no-sensitive
    attributes:
      label: Before you submit
      options:
        - label: This isn't a security problem, and it doesn't include anyone's personal data.
          required: true
