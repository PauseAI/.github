# Reusable secret scan for PauseAI repos. Fails a PR or push that adds a
# verified (or unverifiable) secret. Call it from a repo with:
#
#   name: Secret scan
#   on: [push, pull_request]
#   permissions:
#     contents: read
#   jobs:
#     scan:
#       uses: PauseAI/.github/.github/workflows/secret-scan.yml@main
#
# Public repos already have GitHub push protection; this is for private repos,
# where push protection needs paid GitHub Secret Protection.
name: Secret scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified,unknown
